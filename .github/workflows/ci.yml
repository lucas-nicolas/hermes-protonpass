name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"   # weekly: catch breaking changes on Hermes main

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, Hermes rule set)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff check (ruff.toml mirrors hermes-agent's selection)
        run: uvx ruff@0.15.10 check .

  tests:
    name: Tests on Hermes ${{ matrix.hermes }} (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - hermes: v2026.8.13   # v0.20.1, the requires_hermes floor
            python: "3.11"
          - hermes: v0.22.0      # latest release
            python: "3.14"
          - hermes: main         # development head
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.hermes }}
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes from its lockfile
        run: |
          uv sync --project hermes-agent --locked --python ${{ matrix.python }}
          uv pip install --python hermes-agent/.venv/bin/python pytest
      - name: Run plugin tests (fake pass-cli + Hermes conformance kit)
        working-directory: plugin
        run: ../hermes-agent/.venv/bin/python -m pytest tests -q

  validate:
    name: Catalog validation (hermes plugins validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: v0.22.0
          path: hermes-agent
      - uses: astral-sh/setup-uv@v6
      - name: Install Hermes from its lockfile
        run: uv sync --project hermes-agent --locked --python 3.14
      - name: Validate plugin
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: hermes-agent/.venv/bin/hermes plugins validate "$GITHUB_WORKSPACE/plugin"
